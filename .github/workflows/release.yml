name: Release Windows Installer

on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run desktop:build
      - name: Prepare release files
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release-ulab-desktop-final" -Filter "ULAB-Setup-*-Windows-x64.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installer not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToUpper()
          $checksum = Join-Path $exe.DirectoryName ($exe.Name + ".sha256")
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii $checksum
          "EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "CHECKSUM=$checksum" >> $env:GITHUB_ENV
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "$env:EXE" "$env:CHECKSUM" --title "ULAB ${{ github.ref_name }}" --generate-notes
