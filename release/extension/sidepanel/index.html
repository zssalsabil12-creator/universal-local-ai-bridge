<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Local AI Bridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor"/>
        </svg>
        <span>ULAB</span>
      </div>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Connection Section -->
    <section class="section" id="connection-section">
      <h2>Local Agent</h2>
      <div class="connection-info">
        <p id="connection-status">Not connected to local agent</p>
        <input id="agent-url" type="text" value="ws://127.0.0.1:19999" placeholder="Agent WebSocket URL">
        <input id="agent-token" type="password" placeholder="Security Token">
        <button id="save-agent-btn" class="btn btn-secondary">Save Connection</button>
        <button id="connect-btn" class="btn btn-primary">Connect Agent</button>
      </div>
    </section>

    <!-- Project Section -->
    <section class="section" id="project-section" style="display: none;">
      <h2>Project</h2>
      <div class="project-info">
        <p id="project-name">No project selected</p>
        <div class="workspace-picker">
          <input id="workspace-path" type="text" placeholder="C:\Projects\MyProject" aria-label="Local workspace path">
          <button id="select-project-btn" class="btn btn-secondary">Connect Workspace</button>
        </div>
      </div>
    </section>

    <!-- File Explorer -->
    <section class="section" id="explorer-section" style="display: none;">
      <h2>Files</h2>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search files...">
      </div>
      <div id="file-tree" class="file-tree">
        <!-- File tree will be populated here -->
      </div>
    </section>

    <!-- Context Builder -->
    <section class="section" id="context-section" style="display: none;">
      <h2>Context</h2>
      <div class="context-info">
        <p id="context-count">0 files selected</p>
        <button id="build-context-btn" class="btn btn-primary">Build Context</button>
      </div>
      <div id="selected-files" class="selected-files">
        <!-- Selected files will be shown here -->
      </div>
    </section>

    <!-- Permissions -->
    <section class="section" id="permissions-section" style="display: none;">
      <h2>Permissions</h2>
      <div class="permissions-list">
        <div class="permission-item">
          <span>Read files</span>
          <span class="permission-status allowed">✓ Allowed</span>
        </div>
        <div class="permission-item">
          <span>Search</span>
          <span class="permission-status allowed">✓ Allowed</span>
        </div>
        <div class="permission-item">
          <span>Create files</span>
          <span class="permission-status warning">⚠ Ask</span>
        </div>
        <div class="permission-item">
          <span>Modify files</span>
          <span class="permission-status warning">⚠ Ask</span>
        </div>
        <div class="permission-item">
          <span>Delete files</span>
          <span class="permission-status warning">⚠ Ask</span>
        </div>
        <div class="permission-item">
          <span>Terminal</span>
          <span class="permission-status warning">⚠ Ask</span>
        </div>
      </div>
    </section>

    <!-- Security Status -->
    <footer class="footer">
      <div class="security-status">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="currentColor"/>
        </svg>
        <span>Security: Protected</span>
      </div>
    </footer>
  </div>

  <script src="panel.js"></script>
</body>
</html>
